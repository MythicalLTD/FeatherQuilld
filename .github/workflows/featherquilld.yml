name: FeatherQuilld

on:
  push:
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.slnx'
      - '.github/workflows/featherquilld.yml'
  pull_request:
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.slnx'
      - '.github/workflows/featherquilld.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FeatherQuilld.slnx

      - name: Build
        run: dotnet build FeatherQuilld.slnx --no-restore --configuration ${{ matrix.configuration }}

      - name: Test
        run: dotnet test FeatherQuilld.slnx --no-build --configuration ${{ matrix.configuration }} --nologo

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build daemon image
        run: docker compose build featherquilld
