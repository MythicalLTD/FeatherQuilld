name: FeatherQuilld

on:
  push:
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.slnx'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - '.github/workflows/featherquilld.yml'
  pull_request:
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.slnx'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - '.github/workflows/featherquilld.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FeatherQuilld.slnx

      - name: Build
        run: dotnet build FeatherQuilld.slnx --no-restore --configuration ${{ matrix.configuration }}

      - name: Test
        run: dotnet test FeatherQuilld.slnx --no-build --configuration ${{ matrix.configuration }} --nologo

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build daemon image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: featherquilld:latest
          cache-from: type=gha,scope=featherquilld-docker
          cache-to: type=gha,mode=max,scope=featherquilld-docker
